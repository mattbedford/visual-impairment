    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }

    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

<body>
  <div id="__bundler_placeholder">Loading See What I See: front page sketch...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:#1B1B1B;background:#FFFDF7}\na{color:#1F3A93}a:hover{color:#132566}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width: 100%; min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFDF7; color: #1B1B1B; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif;\" data-canvas-width=\"1280\" data-canvas-height=\"2040\" data-document-role=\"page\" data-label=\"Front page (sketch)\">\n\n  <!-- Sketch stamp -->\n  <div style=\"display: flex; justify-content: center; padding: 12px 24px; background: #FFD23F; color: #1B1B1B; font-weight: 700; font-size: 15px; letter-spacing: 0.04em;\">\n    SKETCH, NOT A DESIGN. Working title. Grey boxes are photos not yet taken.\n  <\u002Fdiv>\n\n  <!-- Header -->\n  <header style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; padding: 24px 56px; border-bottom: 2px solid #1B1B1B;\">\n    <div style=\"display: flex; align-items: center; gap: 16px;\">\n      <div style=\"width: 56px; height: 56px; border: 2px dashed #6B6B6B; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #4A4A4A; text-align: center; line-height: 1.2;\">Sight Support logo<\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n        <div style=\"font-size: 26px; font-weight: 700; line-height: 1.1;\">See What I See<\u002Fdiv>\n        <div style=\"font-size: 15px; color: #4A4A4A;\">A Sight Support Calderdale project for Calderdale primary schools<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <nav aria-label=\"Main\" style=\"display: flex; flex-wrap: wrap; gap: 24px; font-size: 17px; font-weight: 700;\">\n      <a href=\"#try\" style=\"color: #1F3A93; text-decoration: none;\">Try it<\u002Fa>\n      <a href=\"#lesson\" style=\"color: #1F3A93; text-decoration: none;\">The lesson<\u002Fa>\n      <a href=\"#ask\" style=\"color: #1F3A93; text-decoration: none;\">Ask someone who knows<\u002Fa>\n      <a href=\"#about\" style=\"color: #1F3A93; text-decoration: none;\">About<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <!-- Hero -->\n  <section style=\"display: flex; flex-wrap: wrap; gap: 48px; padding: 64px 56px 48px 56px; align-items: center;\">\n    <div style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 24px;\">\n      <h1 style=\"margin: 0; font-size: 52px; line-height: 1.08; font-weight: 700;\">What does your classroom look like with sight loss?<\u002Fh1>\n      <p style=\"margin: 0; font-size: 21px; line-height: 1.5; color: #333333;\">A ten-minute activity for Key Stage 2, ready to run today. Nothing to install, nothing to print, works on the whiteboard.<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 16px;\">\n        <a href=\"#try\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; background: #1F3A93; color: #FFFFFF; font-size: 18px; font-weight: 700; text-decoration: none; border-radius: 6px;\">Try the simulator<\u002Fa>\n        <a href=\"#lesson\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; border: 2px solid #1B1B1B; color: #1B1B1B; font-size: 18px; font-weight: 700; text-decoration: none; border-radius: 6px;\">See the 45-minute lesson<\u002Fa>\n      <\u002Fdiv>\n      <p style=\"margin: 0; font-size: 15px; color: #4A4A4A;\">Made with people in Halifax who live with sight loss. Free for any school to use.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex: 1 1 420px; min-width: 0; aspect-ratio: 4 / 3; border: 2px dashed #6B6B6B; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; color: #4A4A4A; font-size: 16px; line-height: 1.4;\">Photo: a Year 5 class at a Halifax primary, one pupil at the front with a sighted guide (to be taken, with permission)<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Simulator -->\n  <section id=\"try\" style=\"display: flex; flex-direction: column; gap: 24px; padding: 48px 56px; background: #FFFFFF; border-top: 2px solid #1B1B1B; border-bottom: 2px solid #1B1B1B;\">\n    <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n      <h2 style=\"margin: 0; font-size: 34px; font-weight: 700;\">Try it: pick a condition and look at the board<\u002Fh2>\n      <p style=\"margin: 0; font-size: 18px; color: #333333;\">Each one is described in words as well, so everyone in the room can take part.<\u002Fp>\n    <\u002Fdiv>\n    <div role=\"group\" aria-label=\"Choose a sight condition\" style=\"display: flex; flex-wrap: wrap; gap: 12px;\">\n      <sc-for list=\"{{conditions}}\" as=\"c\" hint-placeholder-count=\"6\">\n        <button type=\"button\" sc-camel-on-click=\"{{c.pick}}\" aria-pressed=\"{{c.pressed}}\" style=\"min-height: 48px; padding: 0 20px; border-radius: 999px; font-size: 17px; font-weight: 700; cursor: pointer; font-family: inherit; border: 2px solid #1B1B1B; background: {{c.bg}}; color: {{c.fg}};\">{{c.label}}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 32px; align-items: stretch;\">\n      <div style=\"flex: 2 1 520px; min-width: 0; position: relative; aspect-ratio: 16 / 9; overflow: hidden; border: 2px solid #1B1B1B; background: #E9E4D8;\">\n        <!-- Crude classroom scene; the real thing is a photograph -->\n        <div role=\"img\" aria-label=\"{{sceneAlt}}\" style=\"position: absolute; inset: 0; filter: {{sceneFilter}};\">\n          <div style=\"position: absolute; left: 0; right: 0; top: 0; height: 72%; background: #E9E4D8;\"><\u002Fdiv>\n          <div style=\"position: absolute; left: 0; right: 0; bottom: 0; height: 28%; background: #B9AE98;\"><\u002Fdiv>\n          <div style=\"position: absolute; left: 8%; top: 10%; width: 64%; height: 48%; background: #FFFFFF; border: 6px solid #8C8C8C; box-sizing: border-box; padding: 3% 4%; display: flex; flex-direction: column; gap: 6%;\">\n            <div style=\"font-size: 30px; font-weight: 700; color: #1F3A93; line-height: 1.1;\">Tuesday: fractions<\u002Fdiv>\n            <div style=\"font-size: 24px; color: #1B1B1B; line-height: 1.2;\">3/4 + 1/8 = ?<\u002Fdiv>\n            <div style=\"font-size: 13px; color: #C0392B; line-height: 1.3;\">Homework: page 42, questions 1 to 6. Trip letters back by Friday.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position: absolute; right: 6%; top: 8%; width: 16%; aspect-ratio: 1 / 1; border-radius: 50%; background: #FFFFFF; border: 4px solid #4A4A4A; box-sizing: border-box;\"><\u002Fdiv>\n          <div style=\"position: absolute; right: 9%; top: 36%; width: 10%; height: 20%; background: #7FA7D9; border: 4px solid #4A4A4A; box-sizing: border-box;\"><\u002Fdiv>\n          <div style=\"position: absolute; left: 10%; bottom: 8%; width: 22%; height: 16%; background: #C98A4B; border-radius: 4px;\"><\u002Fdiv>\n          <div style=\"position: absolute; left: 40%; bottom: 8%; width: 22%; height: 16%; background: #C98A4B; border-radius: 4px;\"><\u002Fdiv>\n          <div style=\"position: absolute; left: 70%; bottom: 8%; width: 22%; height: 16%; background: #C98A4B; border-radius: 4px;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div aria-hidden=\"true\" style=\"position: absolute; inset: 0; pointer-events: none; background: {{overlay}};\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 24px; background: #FFFDF7; border: 2px solid #1B1B1B;\">\n        <div style=\"font-size: 14px; font-weight: 700; letter-spacing: 0.06em; color: #4A4A4A;\">WHAT YOU ARE SEEING<\u002Fdiv>\n        <div style=\"font-size: 24px; font-weight: 700;\">{{current}}<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.5; color: #333333;\">{{desc}}<\u002Fp>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.5; color: #4A4A4A; font-style: italic;\">{{voice}}<\u002Fp>\n        <div style=\"margin-top: auto; padding: 12px; border: 2px dashed #6B6B6B; font-size: 13px; color: #4A4A4A; line-height: 1.4;\">Sketch note: wording to come from NHS and RNIB sources and be checked by Sight Support. Filters are rough stand-ins until members have tested them.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Three steps -->\n  <section id=\"lesson\" style=\"display: flex; flex-direction: column; gap: 32px; padding: 56px 56px;\">\n    <h2 style=\"margin: 0; font-size: 34px; font-weight: 700;\">Three things a teacher can do with it<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px; padding: 28px; border: 2px solid #1B1B1B; background: #FFFFFF; min-width: 0;\">\n        <div style=\"width: 44px; height: 44px; border-radius: 50%; background: #1F3A93; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700;\">1<\u002Fdiv>\n        <div style=\"font-size: 22px; font-weight: 700;\">Try it<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.5; color: #333333;\">Ten minutes on the whiteboard. Pick a condition, read the board, try the street scene, talk about what changed.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 12px; padding: 28px; border: 2px solid #1B1B1B; background: #FFFFFF; min-width: 0;\">\n        <div style=\"width: 44px; height: 44px; border-radius: 50%; background: #1F3A93; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700;\">2<\u002Fdiv>\n        <div style=\"font-size: 22px; font-weight: 700;\">Teach it<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.5; color: #333333;\">A 45-minute PSHE lesson with a worksheet and a playground activity in sighted-guide pairs. No preparation needed.<\u002Fp>\n        <a href=\"#lesson\" style=\"font-size: 17px; font-weight: 700; color: #1F3A93;\">Download the lesson (PDF)<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 12px; padding: 28px; border: 2px solid #1B1B1B; background: #FFFFFF; min-width: 0;\">\n        <div style=\"width: 44px; height: 44px; border-radius: 50%; background: #1F3A93; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700;\">3<\u002Fdiv>\n        <div style=\"font-size: 22px; font-weight: 700;\">Ask someone who knows<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.5; color: #333333;\">Invite Sight Support Calderdale to visit, or arrange a call. Real people from Halifax, not a video.<\u002Fp>\n        <a href=\"#ask\" style=\"font-size: 17px; font-weight: 700; color: #1F3A93;\">Request a visit<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Ask someone who knows -->\n  <section id=\"ask\" style=\"display: flex; flex-wrap: wrap; gap: 40px; padding: 56px; background: #1F3A93; color: #FFFFFF; align-items: center;\">\n    <div style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px;\">\n      <div style=\"font-size: 14px; font-weight: 700; letter-spacing: 0.06em; color: #D6DEFA;\">IN SIGHT SUPPORT'S OWN WORDS<\u002Fdiv>\n      <h2 style=\"margin: 0; font-size: 34px; font-weight: 700; line-height: 1.15;\">We are the people in Halifax who know what this is like.<\u002Fh2>\n      <p style=\"margin: 0; font-size: 18px; line-height: 1.5; color: #E8ECFA;\">[Two or three sentences from Sight Support: who you are, what a visit involves, and what children usually ask. Written by you, not us.]<\u002Fp>\n      <a href=\"#ask\" style=\"display: inline-flex; align-self: flex-start; align-items: center; min-height: 52px; padding: 0 28px; background: #FFD23F; color: #1B1B1B; font-size: 18px; font-weight: 700; text-decoration: none; border-radius: 6px;\">Request a visit or a call<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"flex: 1 1 360px; min-width: 0; aspect-ratio: 4 / 3; border: 2px dashed #B8C4F0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; color: #E8ECFA; font-size: 16px; line-height: 1.4;\">Photo: Sight Support members at the hub (to be taken, with permission)<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- About / footer -->\n  <footer id=\"about\" style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px; padding: 32px 56px; border-top: 2px solid #1B1B1B; font-size: 15px; color: #4A4A4A; line-height: 1.5;\">\n    <div style=\"flex: 1 1 400px; min-width: 0;\">A Sight Support Calderdale education project. Built with Hebble &amp; Stone, Halifax. Tested with people who live with sight loss. Everything here is free to reuse and adapt (Creative Commons BY).<\u002Fdiv>\n    <div style=\"flex: 0 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 4px;\">\n      <div>Schools using it so far: [number]<\u002Fdiv>\n      <div>Pupils taught: [number]<\u002Fdiv>\n      <div><a href=\"#about\" style=\"color: #1F3A93;\">About this project<\u002Fa><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1F3A93&quot;,&quot;options&quot;:[&quot;#1F3A93&quot;,&quot;#0B6E4F&quot;,&quot;#7A1E6E&quot;,&quot;#1B1B1B&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:2040}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { picked: 'normal' };\n  }\n  renderVals() {\n    const accent = this.props.accent ?? '#1F3A93';\n    const defs = [\n      { id: 'normal', label: 'Typical sight', filter: 'none', overlay: 'none',\n        desc: 'The whiteboard, the clock and the desks as most people in the room see them. Use this to compare.',\n        voice: '' },\n      { id: 'amd', label: 'Macular degeneration', filter: 'none',\n        overlay: 'radial-gradient(ellipse 30% 36% at 50% 48%, rgba(40,35,30,0.96) 0%, rgba(40,35,30,0.85) 55%, rgba(40,35,30,0) 100%)',\n        desc: 'The middle of what you look at is missing or smudged, while the edges stay. Reading the board means looking slightly to one side of it.',\n        voice: 'Member quote to go here: what reading a menu or a text message is like.' },\n      { id: 'glaucoma', label: 'Glaucoma', filter: 'contrast(0.9)',\n        overlay: 'radial-gradient(ellipse 34% 34% at 50% 50%, rgba(20,20,20,0) 0%, rgba(20,20,20,0) 45%, rgba(20,20,20,0.9) 80%, rgba(20,20,20,1) 100%)',\n        desc: 'The edges go first. You see what is straight ahead, but not the pupil raising a hand beside you or the step at the door.',\n        voice: 'Member quote to go here: what crossing a road or a busy corridor is like.' },\n      { id: 'cataract', label: 'Cataracts', filter: 'blur(3px) contrast(0.6) brightness(1.15) sepia(0.35)',\n        overlay: 'rgba(255,240,200,0.25)',\n        desc: 'Everything is misty and washed out, like looking through a steamed-up window. Bright light makes it worse, not better.',\n        voice: 'Member quote to go here: what a sunny day or car headlights are like.' },\n      { id: 'dr', label: 'Diabetic retinopathy', filter: 'blur(1px) contrast(0.85)',\n        overlay: 'radial-gradient(circle 60px at 30% 35%, rgba(30,20,20,0.95) 0%, rgba(30,20,20,0.95) 60%, rgba(30,20,20,0) 100%), radial-gradient(circle 45px at 62% 60%, rgba(30,20,20,0.95) 0%, rgba(30,20,20,0.95) 60%, rgba(30,20,20,0) 100%), radial-gradient(circle 80px at 75% 25%, rgba(30,20,20,0.9) 0%, rgba(30,20,20,0.9) 50%, rgba(30,20,20,0) 100%), radial-gradient(circle 35px at 45% 80%, rgba(30,20,20,0.95) 0%, rgba(30,20,20,0.95) 60%, rgba(30,20,20,0) 100%)',\n        desc: 'Dark patches float across the view and the picture is slightly blurred. The patches move, so what you could read a moment ago may be hidden now.',\n        voice: 'Member quote to go here.' },\n      { id: 'cvi', label: 'Cerebral visual impairment', filter: 'contrast(0.75) saturate(0.6)',\n        overlay: 'none',\n        desc: 'The eyes work but the brain struggles to make sense of a busy picture. A cluttered board or a crowded room becomes hard to read. This is the most common cause of sight loss in UK children, and it needs careful, specialist input before we show it.',\n        voice: 'To be designed with a specialist, not guessed.' }\n    ];\n    const picked = this.state.picked;\n    const cur = defs.find(d => d.id === picked) || defs[0];\n    const conditions = defs.map(d => ({\n      label: d.label,\n      pressed: d.id === picked ? 'true' : 'false',\n      bg: d.id === picked ? accent : '#FFFFFF',\n      fg: d.id === picked ? '#FFFFFF' : '#1B1B1B',\n      pick: () => this.setState({ picked: d.id })\n    }));\n    return {\n      conditions,\n      current: cur.label,\n      desc: cur.desc,\n      voice: cur.voice,\n      sceneFilter: cur.filter,\n      overlay: cur.overlay,\n      sceneAlt: 'A classroom whiteboard reading Tuesday: fractions, a clock, a window and three desks, shown as someone with ' + cur.label.toLowerCase() + ' might see it. ' + cur.desc\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
